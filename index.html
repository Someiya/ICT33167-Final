<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจองคิวปุกปุย คลินิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-sized clinic app (LINE-style) with a bottom tab bar; soft pastel world with our own round pet characters. */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --ink:#3B3530; --muted:#968B80; --line:#EFE7DC;
  --teal:#3FAFAA; --teal-d:#2A8C87; --teal-soft:#E0F4F2;
  --yellow:#F4C83E; --yellow-ink:#4A3A0C; --peach:#FBE3D0; --butter:#FFF4D2;
  --red:#E25B57; --red-soft:#FCE6E3; --ok:#3A9F6B; --ok-soft:#E2F4E9; --warn:#A8730A; --warn-soft:#FFF1CC;
  --f-display:'Mitr','IBM Plex Sans Thai Looped',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai Looped','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#EADFD1;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.3;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

.phone{height:100%;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){body{padding:24px 0}.phone{border-radius:30px;box-shadow:0 20px 60px rgba(80,55,30,.18);border:1px solid #E2D5C4}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* app bar */
.appbar{position:sticky;top:0;z-index:5;background:var(--surface);display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);min-height:56px}
.appbar h1{font-size:17px;text-align:center}
.appbar .ab-right{display:flex;justify-content:flex-end;align-items:center}
.appbar .ab-left{display:flex;align-items:center}
.icon-btn{position:relative}
.icon-btn .nb{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg)}
.logo{display:grid;place-items:center}
.staff{font-size:11px;background:var(--teal-soft);color:var(--teal-d);padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.progress{display:flex;gap:6px;padding:10px 16px 0}
.progress i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.progress i.on{background:var(--teal)}

.pad{padding:16px}
.sec{font-size:16px;margin:22px 0 10px}
.q{font-size:18px;margin:18px 0 10px}
.q small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.q:first-child{margin-top:4px}

/* hero */
.hero{background:var(--peach);padding:18px 16px 0;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--butter);right:-70px;top:-60px}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.hero .hi{margin:0;font-size:14px;color:#8A6A55}
.hero h2{font-size:22px;margin:2px 0 4px}
.hero p.sub{margin:0;font-size:13.5px;color:#8A6A55}
.hero-mascot{flex:none;margin-bottom:-6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.friends{position:relative;display:flex;justify-content:center;margin-top:14px;padding-bottom:16px}
.friends > *{margin:0 -7px;border:3px solid var(--peach);border-radius:50%;display:block}
.friends > *:nth-child(odd){transform:translateY(-8px)}

/* cards & lists */
.card{background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.appt-card{display:block;width:100%;text-align:left;padding:14px;margin-top:4px}
.ac-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;color:var(--teal-d);background:var(--teal-soft);padding:2px 10px;border-radius:999px}
.code{font-family:var(--f-display);font-size:13.5px;color:var(--muted);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.ac-main{display:flex;gap:12px;align-items:center}
.ac-main b{font-family:var(--f-display);font-weight:500;font-size:17px;display:block}
.ac-main span{display:block;font-size:13.5px;color:var(--muted)}
.empty-card{margin-top:4px;padding:16px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:14px}

.cta{display:block;width:100%;background:var(--yellow);color:var(--yellow-ink);font-family:var(--f-display);font-weight:500;font-size:17px;padding:14px;border-radius:999px;text-align:center;box-shadow:0 3px 0 #D9AC22}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #D9AC22}
.cta:disabled{background:#E8E1D7;color:#B3A89B;box-shadow:none}
.cta.teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.ghost-btn{display:block;width:100%;padding:12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;text-align:center}
.mt{margin-top:14px}

.pets-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pet-chip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.pet-chip b{display:block;font-weight:600;font-size:14.5px;line-height:1.2}
.pet-chip span{font-size:12.5px;color:var(--muted)}

.list{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row .s{display:block;font-size:13px;color:var(--muted)}
.row .price{font-size:14px;color:var(--muted);white-space:nowrap}
.row .ic{width:36px;height:36px;border-radius:12px;background:var(--teal-soft);color:var(--teal-d);display:grid;place-items:center;flex:none}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #D8CDBF;flex:none;display:grid;place-items:center}
.row[aria-pressed="true"]{background:var(--teal-soft)}
.row[aria-pressed="true"] .radio{border-color:var(--teal);background:var(--teal)}
.row[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.day{flex:none;width:64px;padding:8px 4px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:center}
.day .wd{font-size:12px;color:var(--muted)}
.day .dn{font-family:var(--f-display);font-size:22px;line-height:1.15}
.day .st{font-size:11px;font-weight:600;color:var(--ok)}
.day .st.full{color:var(--red)} .day .st.off{color:var(--muted)}
.day[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .st{color:#fff}
.slot-h{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots.four{grid-template-columns:repeat(4,1fr)}
.slot{padding:9px 4px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:center;line-height:1.2}
.slot b{display:block;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.slot span{font-size:11.5px;color:var(--ok)}
.slot.full{background:var(--red-soft);border-color:transparent}
.slot.full span{color:var(--red)}
.slot.closed,.slot.past{background:transparent;border-style:dashed;color:#B9AEA1}
.slot.closed span,.slot.past span{color:#B9AEA1}
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.slot[aria-pressed="true"] span{color:#fff}
.slot.full[aria-pressed="true"]{background:var(--red-soft);border:1.5px solid var(--red);color:var(--red)}
.slot.full[aria-pressed="true"] span{color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--line);background:var(--surface)}
.legend .l-sel{background:var(--teal);border-color:var(--teal)}
.legend .l-full{background:var(--red-soft);border-color:transparent}
.legend .l-off{background:transparent;border-style:dashed}

.sum-card{padding:16px}
.sum-head{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.sum-head b{font-family:var(--f-display);font-weight:500;font-size:19px;display:block}
.sum-head div span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;margin:0;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
textarea{width:100%;min-height:76px;resize:vertical;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
textarea:focus{border-color:var(--teal);outline:none}
.flabel{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
.msg{border-radius:14px;padding:10px 12px;font-size:14px;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.msg svg{flex:none;margin-top:2px}
.msg.err{background:var(--red-soft);color:#B53E3B}
.msg.info{background:var(--warn-soft);color:var(--warn)}
.link-btn{display:block;margin:14px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.actionbar{padding:10px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}

/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:#A79C90;padding:4px 0;position:relative}
.nav button[aria-current="page"]{color:var(--teal-d);font-weight:600}
.nav .nb{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}

/* done */
.done{text-align:center;padding:28px 20px 20px}
.done h2{font-size:24px;margin-top:8px}
.done .big{font-family:var(--f-display);font-size:30px;color:var(--teal-d);letter-spacing:1px;margin:2px 0 14px}
.done p{color:var(--muted);margin:4px 0}
.done .card{text-align:left;padding:14px;margin:8px 0 12px}

/* pills */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-booked{background:var(--teal-soft);color:var(--teal-d)}
.p-checkedin{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-cancelled{background:#F1ECE6;color:var(--muted)}
.p-noshow{background:var(--red-soft);color:#B53E3B}

/* mine */
.appt{padding:14px;display:grid;gap:10px}
.appt + .appt{margin-top:10px}
.appt .ac-main b{font-size:16px}
.appt.off{opacity:.65}
.small-btn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:500;background:var(--surface)}
.small-btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.small-btn.green{background:var(--ok);border-color:var(--ok);color:#fff}
.small-btn.red{background:var(--red);border-color:var(--red);color:#fff}
.hint{font-size:12.5px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;color:var(--muted);text-align:center;font-size:14px}

/* clinic */
.seg{display:flex;background:#F1EAE0;border-radius:999px;padding:4px;margin:12px 16px 0}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500;position:relative}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(80,55,30,.12)}
.seg .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.stat b{font-family:var(--f-display);font-weight:500;font-size:22px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.s1 b{color:var(--teal-d)} .stat.s2 b{color:var(--warn)} .stat.s3 b{color:var(--ok)} .stat.s4 b{color:var(--red)}
.qi{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi.is-new{background:var(--butter)}
.qi.off .nm{text-decoration:line-through;color:var(--muted)}
.qi-time{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;padding-top:2px}
.qi-main{display:flex;gap:10px;min-width:0}
.qi-txt{flex:1;min-width:0}
.qi-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.qi .nm{font-weight:600}
.qi .s{display:block;font-size:12.5px;color:var(--muted)}
.qi .note{display:block;font-size:12.5px;color:var(--warn);margin-top:2px}
.qi-act{display:flex;gap:6px;margin-top:8px}
.nt{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.nt:last-child{border-bottom:0}
.nt.unread{background:#F3FAF9}
.nt b{font-weight:600;font-size:14px;display:block}
.nt.cancel b{color:#B53E3B}
.nt span{display:block;font-size:12.5px;color:var(--muted)}
.nt .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px}
.switch{width:50px;height:30px;border-radius:999px;background:#DCD2C5;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--red)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.mslot.m-closed{background:transparent;border-style:dashed}
.mslot.m-closed span{color:var(--red)}
.mslot.m-full span{color:var(--red)}
.mslot:disabled{opacity:.5}

/* pets + change */
.pet-chip{text-align:left}
.pet-chip .pok{color:var(--ok);font-weight:600}
.pet-chip .pwarn,.pf-head .pwarn{color:var(--warn);font-weight:600}
.pf-head .pok{color:var(--ok);font-weight:600}
.pet-chip.add{border-style:dashed}
.addic{width:40px;height:40px;border-radius:50%;background:var(--teal-soft);color:var(--teal-d);display:grid;place-items:center;font-size:22px;font-weight:600;flex:none}
.pf-head{display:flex;gap:14px;align-items:center;padding:14px}
.pf-head b{font-family:var(--f-display);font-weight:500;font-size:19px;display:block}
.pf-head span{font-size:13px}
.chg{display:block;font-size:12px;line-height:1.4;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:3px 8px;margin-top:5px;min-width:0}
.appt{min-width:0}
.msg.okm{background:var(--ok-soft);color:var(--ok)}
/* login */
.login{min-height:100%;display:flex;flex-direction:column}
.login-hero{background:var(--peach);text-align:center;padding:36px 16px 26px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.login-hero::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:var(--butter);left:50%;top:-150px;transform:translateX(-50%)}
.login-hero > *{position:relative}
.login-hero svg{margin:0 auto}
.login-hero h1{font-size:26px;margin-top:10px}
.login-hero p{margin:2px 0 0;color:#8A6A55;font-size:14px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.inp:focus{border-color:var(--teal);outline:none}
.demo-acc{margin-top:18px;background:var(--surface);border:1.5px dashed #E2D5C4;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.demo-acc div{flex:1;font-size:13px;color:var(--muted)}
.demo-acc b{display:block;color:var(--ink);font-size:13.5px}
.lock{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:14px}
.remind{display:flex;gap:10px;align-items:center;background:var(--butter);border:1px solid #F3E2A6;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px;width:100%;text-align:left}
.remind b{font-weight:600}
/* ticket + live */
.p-inroom{background:var(--red);color:#fff}
.ticket{border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(80,55,30,.08)}
.tk-top{background:var(--teal);color:#fff;padding:14px 18px 18px;position:relative;overflow:hidden}
.tk-top::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);right:-50px;top:-70px}
.tk-brand{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:14px}
.tk-q{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.tk-q span{opacity:.9;font-size:15px}
.tk-q b{font-family:var(--f-display);font-size:60px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.tk-when{font-size:14.5px;margin-top:4px}
.tk-cut{height:24px;background:radial-gradient(circle at 0 50%,var(--bg) 11px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11px,transparent 12px),var(--surface);position:relative}
.tk-cut::before{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:2px dashed var(--line)}
.tk-body{padding:2px 18px 18px}
.tk-qr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tk-qr svg{width:148px;height:148px}
.qr-fallback{width:148px;height:148px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.live{padding:14px 16px;margin-top:14px}
.live-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.6s infinite}
.live-dot.off{background:#CFC6BA;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,91,87,.55)}70%{box-shadow:0 0 0 9px rgba(226,91,87,0)}100%{box-shadow:0 0 0 0 rgba(226,91,87,0)}}
.live-big{font-family:var(--f-display);font-size:32px;margin-top:8px;color:var(--teal-d);line-height:1.2}
.live-big.go{color:var(--red);animation:pop .7s ease}
@keyframes pop{40%{transform:scale(1.1)}}
.live-sub{color:var(--muted);font-size:14px}
.now{margin-top:10px;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13.5px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);padding:0;margin:16px 0 0}
.steps li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);position:relative;text-align:center}
.steps li i{width:18px;height:18px;border-radius:50%;background:var(--line);position:relative;z-index:1;border:3px solid var(--surface)}
.steps li::before{content:"";position:absolute;top:7.5px;right:50%;width:100%;height:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.ok i,.steps li.cur i{background:var(--teal)}
.steps li.ok::before,.steps li.cur::before{background:var(--teal)}
.steps li.cur i{box-shadow:0 0 0 3px var(--teal-soft)}
.steps li.cur span{color:var(--ink);font-weight:600}
.mini-live{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:600;color:var(--teal-d);font-size:14px}
/* LINE */
.line-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#EAF8EF;border:1px solid #C5EBD2;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.line-card .lc-ic,.push-ic{width:38px;height:38px;border-radius:12px;background:#06C755;color:#fff;display:grid;place-items:center;flex:none}
.line-card b{display:block;font-weight:600}
.line-card .s{display:block;font-size:12.5px;color:var(--muted)}
.lc-go{font-size:13px;color:#05A146;font-weight:600;white-space:nowrap}
.small-btn.green-line{background:#06C755;border-color:#06C755;color:#fff;white-space:nowrap}
.cta.line{background:#06C755;color:#fff;box-shadow:0 3px 0 #05A146}
.lappbar{position:sticky;top:0;z-index:5;background:#fff;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:6px 8px;border-bottom:1px solid #E3E6EC;min-height:54px}
.lappbar h1{font-size:16px;text-align:center}
.lappbar h1 small{display:block;font-family:var(--f-body);font-size:11px;color:#8A93A6;font-weight:400}
.lchat{background:#8FA8D3;min-height:calc(100% - 54px);padding:12px 10px 20px}
.lday{margin:2px auto 14px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.16);border-radius:999px;padding:2px 12px;width:max-content}
.lm{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
.lm > svg{align-self:flex-start}
.lm-c{max-width:78%}
.lm-n{display:block;font-size:11.5px;color:#fff;margin-bottom:3px}
.bub{background:#fff;border-radius:18px;border-top-left-radius:6px;padding:9px 12px;font-size:14.5px;line-height:1.45;width:max-content;max-width:100%}
.lm-t{font-size:10.5px;color:#EEF2FA;white-space:nowrap}
.flex{background:#fff;border-radius:16px;overflow:hidden;margin-top:6px;width:240px}
.fx-h{padding:10px 14px;color:#fff;font-family:var(--f-display);font-size:15px;background:var(--teal)}
.fx-h.fx-remind,.fx-h.fx-near{background:#EFA43A}
.fx-h.fx-inroom{background:var(--red)}
.fx-b{padding:10px 14px 8px}
.fx-q{display:flex;gap:10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.fx-q b{font-family:var(--f-display);font-size:16px;font-weight:500;display:block}
.fx-q span{font-size:12.5px;color:var(--muted)}
.fx-row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:2px 0}
.fx-row span{color:var(--muted)}
.fx-btn{display:block;width:100%;padding:11px;border-top:1px solid var(--line);color:#05A146;font-weight:600;text-align:center}
.rich{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #E3E6EC}
.rich button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px 16px;font-size:13px;font-weight:500;border-left:1px solid #E3E6EC;background:linear-gradient(#fff,#F6F1E9)}
.rich button:first-child{border-left:0}
.rich svg{color:var(--teal-d)}
#push{position:absolute;top:8px;left:8px;right:8px;z-index:45}
.push{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.97);border-radius:18px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.2);animation:drop .35s ease}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.push-t{flex:1;min-width:0}
.push-t b{display:block;font-size:12.5px}
.push-t span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.push-time{font-size:11px;color:var(--muted);align-self:flex-start}
/* sheet + toast */
.overlay{position:absolute;inset:0;background:rgba(59,53,48,.45);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:20px 18px 18px;animation:up .22s ease}
.sheet h2{font-size:19px;margin-bottom:6px}
.sheet p{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.sheet .btns{display:grid;gap:8px;margin-top:16px}
.sheet .cta.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #B9423F}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#toast{position:absolute;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40}
.toast{background:rgba(59,53,48,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;animation:up .2s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

                        !qrCode.isDark(row + 1, col) &&

                }
            }

/* ---------- business rules ---------- */
function isPast(date,time){var t=today();if(date<t)return true;if(date>t)return false;return time<=nowHM();}
function closedInfo(date){return S.closed[date]||{all:false,times:[]};}
function takenVets(date,time){return S.bookings.filter(function(b){return b.date===date&&b.time===time&&b.status!=='cancelled';}).map(function(b){return b.vet;});}
function slotInfo(date,time,pref){
  var c=closedInfo(date);
  if(c.all||c.times.indexOf(time)>=0)return {state:'closed',free:[]};
  if(isPast(date,time))return {state:'past',free:[]};
  var taken=takenVets(date,time);
  var free=VETS.map(function(v){return v.id;}).filter(function(id){return taken.indexOf(id)<0;});
  if(pref&&pref!=='any')free=free.filter(function(id){return id===pref;});
  return {state:free.length?'open':'full',free:free};
}
function openCount(date,pref){return SLOTS.filter(function(t){return slotInfo(date,t,pref).state==='open';}).length;}
function canCancel(b){return (slotTime(b.date,b.time)-Date.now())/60000>CANCEL_LIMIT_MIN && (b.status==='booked');}
function notify(kind,b){
  var t=(kind==='new'?'จองใหม่: ':'ลูกค้ายกเลิกนัด: ')+b.pet+' ('+b.type+') · '+svc(b.service).name;
  var sub=fmtDate(b.date)+' '+b.time+' น. · '+vetName(b.vet)+' · '+b.owner;
  S.notifs.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),kind:kind,text:t,sub:sub,at:Date.now(),read:false,bid:b.id});
  S.notifs=S.notifs.slice(0,40);
}

function homeScreen(){
  var next=upcomingMine()[0];
  var friends=[['มะลิ','สุนัข'],['โมจิ','แมว'],['บราวนี่','สุนัข'],['ซูชิ','แมว'],['ลาเต้','สุนัข'],['ปุยฝ้าย','แมว']].map(function(p){return petAv(p[0],p[1],52);}).join('');
  var card=next?'<button class="card appt-card" data-act="ticket" data-v="'+next.id+'"><div class="ac-top"><span class="tag">นัดถัดไป</span><span class="code">'+next.code+'</span></div><div class="ac-main">'+petAv(next.pet,next.type,54)+'<div><b class="tnum">'+fmtDate(next.date)+' · '+next.time+' น.</b><span>'+esc(next.pet)+' · '+esc(svc(next.service).name)+'</span><span>'+esc(vetName(next.vet))+'</span></div></div>'+miniLive(next)+'</button>'
    :'<div class="card empty-card">'+mascot(48,'#FFF0B8')+'<span>ยังไม่มีนัดเลย จองคิวให้น้องได้ที่ปุ่มด้านล่าง</span></div>';
  var pets=myPets().map(function(p){var ok=pDone(p);return '<button class="pet-chip" data-act="pet-open" data-v="'+p.id+'">'+petAv(p.name,p.type,40)+'<div><b>'+esc(p.name)+'</b><span class="'+(ok?'pok':'pwarn')+'">'+(ok?'ประวัติครบแล้ว':'กรอกประวัติให้ครบ')+'</span></div></button>';}).join('')+
    '<button class="pet-chip add" data-act="pet-new"><span class="addic">+</span><div><b>เพิ่มน้อง</b><span>กรอกครั้งเดียว</span></div></button>';
  var tg=next?(next.date===today()?'วันนี้':(next.date===dayKey(1)?'พรุ่งนี้':'นัดถัดไป')):'';
  card=card.replace('<span class="tag">นัดถัดไป</span>','<span class="tag">'+tg+'</span>');
  return appbar('ปุกปุย คลินิก',{right:'<button class="icon-btn" data-act="logout-ask" aria-label="ออกจากระบบ">'+IC.out+'</button>'})+
  '<section class="hero"><div class="hero-top"><div><p class="hi">สวัสดี '+ME.name+'</p><h2>วันนี้น้องๆ สบายดีไหม?</h2><p class="sub">จองคิวหาหมอได้ทุกที่ ไม่ต้องโทร</p></div><div class="hero-mascot">'+mascot(92,'#FFF4D2')+'</div></div><div class="friends">'+friends+'</div></section>'+
  '<div class="pad">'+card+
   '<button class="cta mt" data-act="start">จองคิวใหม่</button><div style="margin-top:14px">'+lineCard()+'</div>'+
   '<h3 class="sec">สัตว์เลี้ยงของฉัน</h3><div class="pets-row">'+pets+'</div>'+
   '<h3 class="sec">ข้อมูลคลินิก</h3><div class="list">'+
    '<div class="row"><span class="ic">'+IC.clock+'</span><div class="grow"><b>เปิดทุกวัน 09:00–18:00</b><span class="s">พักเที่ยง 12:00–13:00</span></div></div>'+
    '<div class="row"><span class="ic">'+IC.phone+'</span><div class="grow"><b>02-123-4567</b><span class="s">ฉุกเฉินโทรได้ตลอด</span></div></div>'+
   '</div></div>';
}

function bookScreen(){
  var head=appbar('จองคิว',{back:'back',right:'<span class="code">'+step+'/3</span>'})+'<div class="progress"><i class="on"></i><i class="'+(step>=2?'on':'')+'"></i><i class="'+(step>=3?'on':'')+'"></i></div>';
  var body='';
  if(step===1){
    body='<h2 class="q">พาน้องคนไหนมา?</h2><div class="list">'+myPets().map(function(p){return '<button class="row" data-act="pet" data-v="'+p.id+'" aria-pressed="'+(sel.pet===p.id)+'">'+petAv(p.name,p.type,44)+'<span class="grow"><b>'+esc(p.name)+'</b><span class="s">'+esc(pInfo(p))+(pDone(p)?'':' · <span style="color:var(--warn)">ประวัติยังไม่ครบ</span>')+'</span></span><span class="radio"></span></button>';}).join('')+'<button class="row" data-act="pet-new"><span class="ic" style="font-size:22px;font-weight:600">+</span><span class="grow"><b>เพิ่มน้องตัวใหม่</b><span class="s">กรอกประวัติครั้งเดียว ใช้ได้ทุกครั้ง</span></span></button></div>'+
      '<h2 class="q">รับบริการอะไรดี?</h2><div class="list">'+SERVICES.map(function(s){return '<button class="row" data-act="svc" data-v="'+s.id+'" aria-pressed="'+(sel.service===s.id)+'"><span class="ic">'+SVC_IC[s.id]+'</span><span class="grow"><b>'+esc(s.name)+'</b></span><span class="price">'+esc(s.price)+'</span><span class="radio"></span></button>';}).join('')+'</div>'+
      '<h2 class="q">อยากพบหมอคนไหน?</h2><div class="chips"><button class="chip" data-act="vet" data-v="any" aria-pressed="'+(sel.vet==='any')+'">ใครก็ได้</button>'+VETS.map(function(v){return '<button class="chip" data-act="vet" data-v="'+v.id+'" aria-pressed="'+(sel.vet===v.id)+'">'+esc(v.name)+'</button>';}).join('')+'</div>';
  }else if(step===2){
    var days=DAYS.map(function(k,i){var c=closedInfo(k),n=openCount(k,sel.vet),d=parseKey(k);
      var st=c.all?'<span class="st off">ปิด</span>':(n?'<span class="st">ว่าง '+n+'</span>':'<span class="st full">เต็ม</span>');
      return '<button class="day" data-act="day" data-v="'+k+'" aria-pressed="'+(sel.date===k)+'"><div class="wd">'+(i===0?'วันนี้':TH_DAY[d.getDay()])+'</div><div class="dn">'+d.getDate()+'</div>'+st+'</button>';}).join('');
    function grid(list){return '<div class="slots">'+list.map(function(t){
      var info=slotInfo(sel.date,t,sel.vet),lab;
      if(info.state==='open')lab=(sel.vet==='any'&&info.free.length===1)?'เหลือ 1':'ว่าง';else lab={full:'เต็ม',closed:'ปิดรับ',past:'เลยเวลา'}[info.state];
      var pr=sel.time===t;
      return '<button class="slot '+info.state+'" data-act="slot" data-v="'+t+'" aria-pressed="'+pr+'"'+(info.state==='open'||pr?'':' disabled')+'><b>'+t+'</b><span>'+lab+'</span></button>';}).join('')+'</div>';}
    var c=closedInfo(sel.date),d=parseKey(sel.date);
    body='<h2 class="q">วันไหนสะดวก? <small>'+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543)+'</small></h2><div class="days">'+days+'</div>'+
      '<h2 class="q">เลือกเวลา <small>คิวละ 30 นาที</small></h2>'+
      (c.all?'<div class="empty">'+mascot(72,'#E6E1F5')+'<span>วันนี้คลินิกปิด ลองเลือกวันอื่นนะ</span></div>':
      '<div class="slot-h">ช่วงเช้า</div>'+grid(SLOTS.filter(function(t){return t<'12:00';}))+'<div class="slot-h">ช่วงบ่าย</div>'+grid(SLOTS.filter(function(t){return t>='13:00';}))+
      '<div class="legend"><span><i></i>ว่าง</span><span><i class="l-sel"></i>ที่เลือก</span><span><i class="l-full"></i>มีคนจองแล้ว</span><span><i class="l-off"></i>ปิดรับ/เลยเวลา</span></div>');
  }else{
    var p=myPets().find(function(x){return x.id===sel.pet;});
    body='<h2 class="q">เช็กอีกทีก่อนยืนยันนะ</h2><div class="card sum-card"><div class="sum-head">'+petAv(p.name,p.type,56)+'<div><b>'+esc(p.name)+'</b><span>'+esc(pInfo(p))+'</span></div></div>'+
      '<dl class="kv"><dt>บริการ</dt><dd>'+esc(svc(sel.service).name)+' · '+esc(svc(sel.service).price)+'</dd><dt>วันที่</dt><dd>'+fmtDate(sel.date,true)+'</dd><dt>เวลา</dt><dd>'+(sel.time?sel.time+' น.':'<span style="color:var(--red)">ยังไม่ได้เลือก</span>')+'</dd><dt>หมอ</dt><dd>'+(sel.vet==='any'?'ใครก็ได้ (ระบบเลือกให้)':esc(vetName(sel.vet)))+'</dd></dl></div>'+
      (pDone(p)?'<div class="msg okm">'+IC.check2+'<span>ประวัติของ'+esc(p.name)+'ครบแล้ว ไปถึงคลินิกไม่ต้องกรอกกระดาษ</span></div>':'<button class="msg info" style="width:100%;text-align:left" data-act="pet-open" data-v="'+p.id+'">'+IC.alert+'<span>ประวัติของ'+esc(p.name)+'ยังไม่ครบ กรอกในแอปก่อนไป จะได้ไม่ต้องเขียนที่คลินิก <u>กรอกเลย</u></span></button>')+
      '<label class="flabel" for="note">อาการเบื้องต้น (ถ้ามี)</label><textarea id="note" placeholder="เช่น ไม่ค่อยกินข้าวมา 2 วัน">'+esc(sel.note)+'</textarea>'+
      (formErr?'<div class="msg err" role="alert">'+IC.alert+'<span>'+formErr+'</span></div>':'')+
      (formInfo?'<div class="msg info" role="status">'+IC.alert+'<span>'+formInfo+'</span></div>':'')+
      '<button class="link-btn" data-act="rival">(เดโม) ให้คนอื่นจองเวลานี้ตัดหน้า</button>';
  }
  return head+'<div class="pad">'+body+'</div>';
}
function bookBar(){
  var ok=step===1?!!(sel.pet&&sel.service):step===2?!!sel.time:true;
  var lab=step===3?'ยืนยันการจอง':'ถัดไป';
  if(step===3&&!sel.time)return '<div class="actionbar"><button class="cta" data-act="goto-step2">เลือกเวลาใหม่</button></div>';
  return '<div class="actionbar"><button class="cta" data-act="next"'+(ok?'':' disabled')+'>'+lab+'</button></div>';
}
function doneScreen(){
  var b=S.bookings.find(function(x){return x.id===doneId;});if(!b)return homeScreen();
  return appbar('จองสำเร็จ')+'<div class="done"><div style="display:inline-block">'+mascot(120,'#FFF4D2')+'</div><h2>จองคิวเรียบร้อย!</h2><p>รหัสการจอง</p><div class="big">'+b.code+'</div>'+
    '<div class="card"><div class="sum-head">'+petAv(b.pet,b.type,48)+'<div><b>'+esc(b.pet)+'</b><span>'+esc(svc(b.service).name)+'</span></div></div><dl class="kv"><dt>วันที่</dt><dd>'+fmtDate(b.date,true)+'</dd><dt>เวลา</dt><dd>'+b.time+' น.</dd><dt>หมอ</dt><dd>'+esc(vetName(b.vet))+'</dd></dl></div>'+
    '<p>คิวที่ '+qNo(b)+' · คลินิกได้รับแจ้งเตือนแล้ว'+(lineOn()?' และส่งบัตรคิวเข้า LINE ให้แล้ว':' ระบบจะเตือนก่อนวันนัด 1 วัน')+'</p>'+
    '<button class="cta mt" data-act="ticket" data-v="'+b.id+'">ดูบัตรคิว</button><button class="ghost-btn mt" data-act="nav" data-v="home">กลับหน้าแรก</button></div>';
}
function mineScreen(){
  var up=upcomingMine();
  var off=S.bookings.filter(function(b){return b.mine&&b.status==='cancelled';}).sort(function(a,b){return (b.cancelledAt||0)-(a.cancelledAt||0);}).slice(0,3);
  function card(b){
    var cc=canCancel(b);
    return '<div class="card appt'+(b.status==='cancelled'?' off':'')+'"><div class="ac-top" style="margin:0"><span class="pill p-'+b.status+'">'+STATUS[b.status]+'</span><span class="code">'+b.code+'</span></div>'+
      '<div class="ac-main">'+petAv(b.pet,b.type,50)+'<div><b class="tnum">'+fmtDate(b.date)+' · '+b.time+' น.</b><span>'+esc(b.pet)+' · '+esc(svc(b.service).name)+'</span><span>'+esc(vetName(b.vet))+' · <b style="font-family:inherit;font-size:13.5px;display:inline;color:var(--ink)">'+baht(bprice(b))+'</b></span></div></div>'+chgLine(b)+
      (isActive(b.status)?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-btn yellow" data-act="ticket" data-v="'+b.id+'">ดูบัตรคิว</button>'+(b.status==='booked'?'<button class="small-btn" data-act="chg-ask" data-v="'+b.id+'">เปลี่ยนแพ็กเกจ</button>':'')+(b.status==='booked'&&cc?'<button class="small-btn" data-act="cancel-ask" data-v="'+b.id+'">ยกเลิกนัด</button>':'')+'</div>'+(b.status==='booked'&&!cc?'<div class="hint">เหลือไม่ถึง 1 ชม. ถ้าจะยกเลิกโทร 02-123-4567</div>':''):'')+'</div>';
  }
  return appbar('นัดของฉัน')+'<div class="pad">'+
    (up.length?up.map(card).join(''):'<div class="empty">'+mascot(80,'#FFF0B8')+'<span>ยังไม่มีนัดที่กำลังจะถึง</span><button class="small-btn yellow" data-act="start">จองคิวเลย</button></div>')+
    '<p class="hint" style="margin-top:12px">ยกเลิกเองได้ก่อนเวลานัดอย่างน้อย 1 ชั่วโมง คิวที่ยกเลิกจะว่างให้คนอื่นทันที</p>'+
    (off.length?'<h3 class="sec">ยกเลิกแล้ว</h3>'+off.map(card).join(''):'')+'</div>';
}
function clinicScreen(){
  var unread=S.notifs.filter(function(n){return !n.read;}).length;
  var h=appbar('หลังบ้านคลินิก',{left:'<span class="staff">พนักงาน</span>',right:'<button class="icon-btn" data-act="logout-ask" aria-label="ออกจากระบบ">'+IC.out+'</button>'})+
    '<div class="seg" role="tablist"><button role="tab" data-act="ctab" data-v="queue" aria-selected="'+(ctab==='queue')+'">คิว</button><button role="tab" data-act="ctab" data-v="notif" aria-selected="'+(ctab==='notif')+'">แจ้งเตือน'+(unread?'<span class="cnt">'+unread+'</span>':'')+'</button><button role="tab" data-act="ctab" data-v="time" aria-selected="'+(ctab==='time')+'">เปิด-ปิดคิว</button></div>';
  var days='<div class="days">'+DAYS.map(function(d,i){var n=S.bookings.filter(function(b){return b.date===d&&b.status!=='cancelled';}).length,c=closedInfo(d),dt=parseKey(d);
    return '<button class="day" data-act="cday" data-v="'+d+'" aria-pressed="'+(cdate===d)+'"><div class="wd">'+(i===0?'วันนี้':TH_DAY[dt.getDay()])+'</div><div class="dn">'+dt.getDate()+'</div>'+(c.all?'<span class="st off">ปิด</span>':'<span class="st" style="color:inherit">'+n+' นัด</span>')+'</button>';}).join('')+'</div>';
  var body='';
  if(ctab==='queue'){
    var list=S.bookings.filter(function(b){return b.date===cdate;}).sort(function(a,b){return a.time.localeCompare(b.time)||a.vet.localeCompare(b.vet);});
    var cnt={all:0,booked:0,in:0,off:0};
    list.forEach(function(b){if(b.status==='cancelled'||b.status==='noshow')cnt.off++;else{cnt.all++;if(b.status==='booked')cnt.booked++;else cnt.in++;}});
    var items=list.length?list.map(function(b){
      var act='';
      if(b.status==='booked')act='<div class="qi-act"><button class="small-btn yellow" data-act="st" data-v="'+b.id+'" data-to="checkedin">เช็กอิน</button><button class="small-btn" data-act="st" data-v="'+b.id+'" data-to="noshow">ไม่มา</button></div>';
      else if(b.status==='checkedin')act='<div class="qi-act"><button class="small-btn red" data-act="st" data-v="'+b.id+'" data-to="inroom">เรียกเข้า'+ROOM[b.vet]+'</button></div>';
      else if(b.status==='inroom')act='<div class="qi-act"><button class="small-btn green" data-act="st" data-v="'+b.id+'" data-to="done">ตรวจเสร็จ</button></div>';
      var off=b.status==='cancelled'||b.status==='noshow';
      return '<div class="qi'+(off?' off':'')+(b.id===lastNew?' is-new':'')+'"><div class="qi-time">'+b.time+'<span class="s" style="font-family:var(--f-body);font-size:11.5px">คิว '+qNo(b)+'</span></div><div class="qi-main">'+petAv(b.pet,b.type,42)+'<div class="qi-txt"><div class="qi-top"><span class="nm">'+esc(b.pet)+'</span><span class="pill p-'+b.status+'">'+STATUS[b.status]+'</span></div>'+
        '<span class="s">'+esc(b.owner)+' · '+esc(svc(b.service).name)+' · <b style="color:var(--ink);white-space:nowrap">'+baht(bprice(b))+'</b></span><span class="s">'+esc(vetName(b.vet))+' · '+b.code+'</span>'+chgLine(b)+(b.note?'<span class="note">"'+esc(b.note)+'"</span>':'')+(b.petId?'<div class="qi-act" style="margin-top:6px"><button class="small-btn" data-act="pf-view" data-v="'+b.petId+'">ดูประวัติน้อง</button></div>':'')+act+'</div></div></div>';
    }).join(''):'<div class="empty">'+mascot(72,'#E3F1D4')+'<span>วันนี้ยังไม่มีนัด</span></div>';
    body=days+'<div class="stats"><div class="stat s1"><b>'+cnt.all+'</b><span>นัดทั้งหมด</span></div><div class="stat s2"><b>'+cnt.booked+'</b><span>รอตรวจ</span></div><div class="stat s3"><b>'+cnt.in+'</b><span>มาแล้ว</span></div><div class="stat s4"><b>'+cnt.off+'</b><span>ยกเลิก/ไม่มา</span></div></div><div class="list">'+items+'</div>';
  }else if(ctab==='notif'){
    var nts=S.notifs.length?S.notifs.map(function(n){var bk=n.bid&&S.bookings.find(function(x){return x.id===n.bid;});var nm=n.text.replace(/^[^:]+:\s*/,'').split(' (')[0];var tp=/\(แมว\)/.test(n.text)?'แมว':'สุนัข';
      return '<div class="nt'+(n.read?'':' unread')+(n.kind==='cancel'?' cancel':'')+'">'+petAv(nm,tp,40)+'<div style="flex:1;min-width:0"><b>'+esc(n.text)+'</b><span>'+esc(n.sub)+'</span><span>'+ago(n.at)+'</span></div>'+(n.read?'':'<span class="dot"></span>')+'</div>';}).join(''):'<div class="empty">'+mascot(72)+'<span>ยังไม่มีแจ้งเตือน</span></div>';
    body='<div class="line-card" style="margin-top:4px"><span class="lc-ic">'+IC.chat+'</span><span class="grow"><b>กลุ่ม LINE ทีมปุกปุย</b><span class="s">การจองใหม่และการยกเลิกส่งเข้ากลุ่มของทีมอัตโนมัติ</span></span></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px"><span class="hint">'+(unread?'ยังไม่ได้อ่าน '+unread+' รายการ':'อ่านครบแล้ว')+'</span>'+(unread?'<button class="small-btn" data-act="read-all">อ่านทั้งหมด</button>':'')+'</div><div class="list">'+nts+'</div>';
  }else{
    var c=closedInfo(cdate);
    var ms=SLOTS.map(function(t){var tk=takenVets(cdate,t).length,cl=c.all||c.times.indexOf(t)>=0,past=isPast(cdate,t);
      return '<button class="slot mslot'+(cl?' m-closed':'')+(tk>=VETS.length?' m-full':'')+'" data-act="toggle-slot" data-v="'+t+'"'+(past||c.all?' disabled':'')+'><b>'+t+'</b><span>'+(cl?'ปิดรับ':'จอง '+tk+'/'+VETS.length)+'</span></button>';}).join('');
    body=days+'<div class="list" style="margin-top:8px"><div class="switch-row"><div><b>ปิดทำการทั้งวัน</b><span class="s hint" style="display:block">'+fmtDate(cdate,true)+'</span></div><button class="switch" role="switch" aria-checked="'+c.all+'" aria-label="ปิดทำการทั้งวัน" data-act="toggle-day"></button></div></div>'+
      '<h3 class="sec">แตะเพื่อปิด/เปิดรับจองเป็นช่วง</h3><p class="hint" style="margin:-4px 0 10px">เช่น หมอติดผ่าตัดหรือประชุมทีม นัดที่จองไว้แล้วยังอยู่</p><div class="slots four">'+ms+'</div>'+
      '<button class="ghost-btn" style="margin-top:28px" data-act="reset-ask">รีเซ็ตข้อมูลตัวอย่าง</button><p class="hint" style="text-align:center">ข้อมูลเดโมเก็บไว้ในเบราว์เซอร์เครื่องนี้</p>';
  }
  return h+'<div class="pad">'+body+'</div>';
}
function loginScreen(){

  var b=mk(S,{date:sel.date,time:sel.time,vet:info.free[0],owner:ME.name,pet:pet.name,type:pet.type,petId:pet.id,service:sel.service,amt:svc(sel.service).amt,note:sel.note.trim(),status:'booked',mine:true,createdAt:Date.now()});

}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='close-modal'){if(el.classList.contains('overlay')&&e.target!==el)return;closeSheet();return;}
  switch(a){
    case 'nav': if(v==='clinic')sync(); go(v); break;
    case 'start': step=1;formErr='';formInfo='';if(!sel.date||openCount(sel.date,sel.vet)===0)sel.date=firstOpenDay();go('book');break;
    case 'back': formErr='';formInfo=''; if(step>1){step--;render();}else go('home'); break;
    case 'next': if(step<3){step++;formErr='';formInfo='';render();}else confirmBooking(); break;
    case 'goto-step2': step=2;formErr='';formInfo='';render();break;
    case 'pet': sel.pet=v;render();break;
    case 'svc': sel.service=v;render();break;
    case 'vet': sel.vet=v;if(sel.time&&slotInfo(sel.date,sel.time,v).state!=='open')sel.time=null;render();break;
    case 'day': sel.date=v;sel.time=null;render();break;
    case 'slot': if(slotInfo(sel.date,v,sel.vet).state==='open'){sel.time=v;render();}break;
    case 'rival': rival();break;
    case 'cancel-ask':
      var b=S.bookings.find(function(x){return x.id===v;});if(!b)break;
      sheet('<div style="display:flex;gap:12px;align-items:center">'+petAv(b.pet,b.type,52)+'<div><h2>ยกเลิกนัดของ'+esc(b.pet)+'?</h2><p>'+fmtDate(b.date,true)+' เวลา '+b.time+' น.</p></div></div><p>ยกเลิกแล้วคิวนี้จะว่างให้คนอื่นจองได้ทันที</p><div class="btns"><button class="cta red" data-act="cancel-yes" data-v="'+b.id+'">ยกเลิกนัด</button><button class="ghost-btn" data-act="close-modal">ไม่ยกเลิก</button></div>');break;
    case 'cancel-yes':
      sync();var bk=S.bookings.find(function(x){return x.id===v;});
      if(bk&&canCancel(bk)){bk.status='cancelled';bk.cancelledAt=Date.now();notify('cancel',bk);cnotify('cancel',bk,'ยกเลิกนัดของ'+bk.pet+'แล้ว');save();toast('ยกเลิกนัดแล้ว');}
      closeSheet();render();break;
    case 'ltab': loginTab=v;loginErr='';render();break;
    case 'fill': document.getElementById('lu').value=loginTab==='staff'?'staff01':'081-234-5678';document.getElementById('lp').value='1234';break;
    case 'logout-ask': sheet('<h2>ออกจากระบบ?</h2><p>'+(role==='staff'?'ออกจากหน้าหลังบ้านคลินิก':'ต้องเข้าสู่ระบบใหม่เพื่อจองคิว')+'</p><div class="btns"><button class="cta red" data-act="logout">ออกจากระบบ</button><button class="ghost-btn" data-act="close-modal">ยกเลิก</button></div>');break;
    case 'logout': pushSeen=-1;loginTab=role==='staff'?'staff':'customer';setRole(null);closeSheet();loginErr='';step=1;formErr='';formInfo='';go('login');break;
    case 'ctab': ctab=v;render();break;
    case 'pet-open': var pp=myPets().find(function(x){return x.id===v;});if(pp){closeSheet();petEditId=v;draft=JSON.parse(JSON.stringify(pp));formErr='';petBack=view;go('pet');}break;
    case 'pet-new': petEditId=null;draft={type:'แมว'};formErr='';petBack=view;go('pet');break;
    case 'pf-back': draft=null;formErr='';go(petBack&&petBack!=='pet'?petBack:'home');break;
    case 'pf-chip': draft[el.getAttribute('data-f')]=v;render();break;
    case 'pf-save':
      var miss=PF_REQ.filter(function(f){return !draft[f]||!String(draft[f]).trim();});
      if(miss.length){formErr='ยังกรอกไม่ครบ '+miss.length+' ช่อง (ช่องที่มีดอกจัน)';render();screenEl.scrollTop=screenEl.scrollHeight;break;}
      sync();draft.updatedAt=Date.now();
      if(petEditId){var ix=S.myPets.findIndex(function(x){return x.id===petEditId;});if(ix>=0)S.myPets[ix]=draft;}else{draft.id='p'+Date.now();S.myPets.push(draft);if(petBack==='book')sel.pet=draft.id;}
      save();toast('บันทึกประวัติ'+draft.name+'แล้ว');formErr='';var back=petBack&&petBack!=='pet'?petBack:'home';draft=null;go(back);break;
    case 'pf-view': profileSheet(v);break;
    case 'chg-ask': chgId=v;var cb=S.bookings.find(function(x){return x.id===v;});chgSel=cb?cb.service:null;chgSheet();break;
    case 'chg-pick': chgSel=v;chgSheet();break;
    case 'chg-yes':
      sync();var bb=S.bookings.find(function(x){return x.id===chgId;});
      if(bb&&chgSel&&chgSel!==bb.service){
        var fromAmt=bprice(bb),fromName=svc(bb.service).name,to=svc(chgSel);
        bb.history=(bb.history||[]).concat([{at:Date.now(),from:bb.service,fromAmt:fromAmt,to:chgSel,toAmt:to.amt,by:'ลูกค้า'}]);
        bb.service=chgSel;bb.amt=to.amt;
        S.notifs.unshift({id:'n'+Date.now(),kind:'change',text:'ลูกค้าเปลี่ยนแพ็กเกจ: '+bb.pet+' ('+bb.type+') · '+baht(fromAmt)+' → '+baht(to.amt),sub:fromName+' → '+to.name+' · '+fmtDate(bb.date)+' '+bb.time+' น. · '+bb.owner,at:Date.now(),read:false,bid:bb.id});
        cnotify('change',bb,'เปลี่ยนเป็น'+to.name+'แล้ว ราคาใหม่ '+baht(to.amt));
        save();toast('เปลี่ยนแพ็กเกจแล้ว · ราคาใหม่ '+baht(to.amt));
      }
      closeSheet();render();break;
    case 'ticket': ticketId=v;closeSheet();go('ticket');break;
    case 'back-mine': go('mine');break;
    case 'next-ticket': var nt=upcomingMine()[0];if(nt){ticketId=nt.id;go('ticket');}else toast('ยังไม่มีนัดที่กำลังจะถึง');break;
    case 'open-line': document.getElementById('push').innerHTML='';go('line');break;
    case 'call': toast('โทร 02-123-4567');break;
    case 'line-connect': sheet('<div style="text-align:center"><div style="display:inline-block">'+mascot(84,'#E3F1D4')+'</div><h2 style="margin-top:8px">เพิ่มเพื่อน ปุกปุย คลินิก</h2><p>@pukpui-clinic</p><p>เชื่อมต่อแล้วจะได้รับเตือนนัด บัตรคิว และแจ้งเตือนเมื่อถึงคิวทาง LINE</p></div><div class="btns"><button class="cta line" data-act="line-yes">เพิ่มเพื่อนและเชื่อมต่อ</button><button class="ghost-btn" data-act="close-modal">ไว้ทีหลัง</button></div>');break;
    case 'line-yes':
      sync();S.line.connected=true;
      linePush('welcome',null,'สวัสดี'+ME.name+' ขอบคุณที่เพิ่มเพื่อนปุกปุย คลินิก จากนี้ระบบจะส่งเตือนนัดและแจ้งเมื่อถึงคิวให้ทางนี้');
      var nx=upcomingMine()[0];if(nx)linePush('remind',nx,'นัดที่กำลังจะถึงของคุณ');
      save();closeSheet();render();toast('เชื่อมต่อ LINE แล้ว');break;
    case 'cday': cdate=v;render();break;
    case 'st': sync();var s1=S.bookings.find(function(x){return x.id===v;});if(s1){s1.status=el.getAttribute('data-to');if(s1.mine){var m={checkedin:'เช็กอินแล้ว '+s1.pet+' รอเรียกคิวสักครู่นะ',inroom:'ถึงคิวของ'+s1.pet+'แล้ว! เชิญที่'+ROOM[s1.vet]+'ได้เลย',done:s1.pet+' ตรวจเสร็จแล้ว ขอบคุณที่ไว้ใจปุกปุย',noshow:'ไม่พบ'+s1.pet+'ตามเวลานัด ถ้าสะดวกวันอื่นจองใหม่ได้เลย'}[s1.status];if(m)cnotify(s1.status,s1,m);}save();render();toast(s1.status==='done'?s1.pet+' ตรวจเสร็จ · ยอดชำระ '+baht(bprice(s1)):s1.pet+' · '+STATUS[s1.status]);}break;
    case 'read-all': S.notifs.forEach(function(n){n.read=true;});save();render();break;
    case 'toggle-slot': sync();var c=S.closed[cdate]||(S.closed[cdate]={all:false,times:[]});var i=c.times.indexOf(v);
      if(i>=0){c.times.splice(i,1);toast('เปิดรับจอง '+v+' น.');}else{c.times.push(v);toast('ปิดรับจอง '+v+' น.');}save();render();break;
    case 'toggle-day': sync();var cd=S.closed[cdate]||(S.closed[cdate]={all:false,times:[]});cd.all=!cd.all;save();render();toast(cd.all?'ปิดทำการวันนี้แล้ว':'เปิดรับจองแล้ว');break;
    case 'reset-ask': sheet('<h2>รีเซ็ตข้อมูลตัวอย่าง?</h2><p>นัดและแจ้งเตือนทั้งหมดในเครื่องนี้จะกลับเป็นค่าเริ่มต้น</p><div class="btns"><button class="cta red" data-act="reset-yes">รีเซ็ต</button><button class="ghost-btn" data-act="close-modal">ยกเลิก</button></div>');break;
    case 'reset-yes': S=seed();norm();save();lastNew=null;closeSheet();render();toast('รีเซ็ตแล้ว');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.innerHTML)closeSheet();});
document.addEventListener('submit',function(e){
  if(e.target.id!=='lf')return;e.preventDefault();
  loginErr='';setRole(loginTab);sync();
  if(role==='staff'){ctab='queue';cdate=today();go('clinic');toast('เข้าสู่ระบบหลังบ้านแล้ว');}
  else{go('home');toast('ยินดีต้อนรับ '+ME.name);}
});
window.addEventListener('storage',function(e){if(e.key===KEY){
  var c0=S.cnotifs?cUnread():0,s0=S.notifs.filter(function(n){return !n.read;}).length;
  sync();
  if(role==='customer'&&cUnread()>c0&&!lineOn())toast(S.cnotifs[0].text);
  if(role==='staff'&&S.notifs.filter(function(n){return !n.read;}).length>s0)toast(S.notifs[0].text);
  if(view!=='login'&&!(document.activeElement&&document.activeElement.id==='note'))render();}});
setInterval(function(){if(view!=='login'&&!modal.innerHTML&&!(document.activeElement&&document.activeElement.id==='note'))render();},60000);
render();
})();
</script>
